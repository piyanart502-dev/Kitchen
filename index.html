<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KITCHEN WORK</title>
<meta name="description" content="บันทึกงานครัว: อุณหภูมิตู้แช่ บ่อดักไขมัน และสต๊อกเครื่องปรุง">
<meta name="theme-color" content="#17598F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KITCHEN WORK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: phone app shell — sticky app bar, one scrolling screen, bottom tab bar, + button opens a bottom sheet form */
:root{
  --bg:#E9EEF1; --app:#F4F7F8; --surface:#FFFFFF; --sunk:#EDF1F3; --ink:#172026; --muted:#5A6870; --line:#D6DEE2;
  --accent:#135B8A; --accent-ink:#FFFFFF; --accent-soft:#DFEBF4;
  --good:#1B7A4B; --good-soft:#DFF1E7; --warn:#A5650C; --warn-soft:#FAEFD9; --bad:#BC3326; --bad-soft:#FADFDB; --crit:#7E1D3A; --crit-soft:#F3DAE3;
  --shadow:0 1px 2px rgba(20,40,55,.06),0 4px 14px rgba(20,40,55,.06);
  --f-display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1013; --app:#11171B; --surface:#1A2227; --sunk:#141B1F; --ink:#E5ECEF; --muted:#97A6AE; --line:#2A353B;
  --accent:#6DB0DD; --accent-ink:#0B1820; --accent-soft:#1A3140;
  --good:#5CC48E; --good-soft:#153126; --warn:#E3A84B; --warn-soft:#382A13; --bad:#F07A6C; --bad-soft:#3C1C19; --crit:#F08FB0; --crit-soft:#3B1725;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1013; --app:#11171B; --surface:#1A2227; --sunk:#141B1F; --ink:#E5ECEF; --muted:#97A6AE; --line:#2A353B;
  --accent:#6DB0DD; --accent-ink:#0B1820; --accent-soft:#1A3140;
  --good:#5CC48E; --good-soft:#153126; --warn:#E3A84B; --warn-soft:#382A13; --bad:#F07A6C; --bad-soft:#3C1C19; --crit:#F08FB0; --crit-soft:#3B1725;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
body.lock{overflow:hidden}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--app);position:relative;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}

.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--app);display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid transparent}
.appbar.scrolled{border-bottom-color:var(--line)}
.appbar .ttl{flex:1;min-width:0}
.appbar h1{font-size:21px;font-weight:700}
.appbar .sub{font-size:12.5px;color:var(--muted)}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;font-size:12px;color:var(--accent)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--ink)}

.screen{padding-inline:16px;padding-block:6px 16px;display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-h h2{font-size:16px;font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500}

/* home */
.hello{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.hello .d{font-size:13px;opacity:.85}
.hello .big{font-family:var(--f-display);font-size:22px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles>.tile:first-child{grid-column:1/-1}
.tile{background:var(--surface);border:0;border-radius:16px;box-shadow:var(--shadow);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .lab{font-size:13px;color:var(--muted);line-height:1.35}
.tile .val{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.2}
.todo{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.todo button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 14px;text-align:left;cursor:pointer;min-height:56px}
.todo button:last-child{border-bottom:0}
.todo .dot{width:10px;height:10px;border-radius:50%;flex:none}
.todo .tx{flex:1;min-width:0}
.todo .tx small{display:block;color:var(--muted);font-size:12.5px}
.chev{color:var(--muted)}
.done{padding:16px;color:var(--good);font-weight:500;display:flex;gap:10px;align-items:center}

/* lists */
.list{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item>button.main{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 14px;text-align:left;cursor:pointer;min-height:60px}
.item .lead{width:58px;flex:none;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:18px;line-height:1.1}
.item .lead small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.item .mid{flex:1;min-width:0}
.item .mid b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid span{font-size:12.5px;color:var(--muted);display:block}
.item .more{padding:0 14px 12px 84px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.item .more p{margin:0}
.item .more .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.daylbl{font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 14px 4px;background:var(--sunk);letter-spacing:.02em}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.none{background:var(--sunk);color:var(--muted)}
.stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}

.cabs{display:flex;flex-direction:column;gap:10px}
.cab{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cab .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cab .head small{color:var(--muted);font-size:12.5px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:8px;text-align:center;background:none;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-height:74px;justify-content:center}
.slot span{font-size:12px;color:var(--muted)}
.slots.one{grid-template-columns:1fr}
.slot b{font-family:var(--f-mono);font-size:19px;font-weight:600}
.slot.good{border:1.5px solid var(--good);background:var(--good-soft)} .slot.good b{color:var(--good)}
.slot.bad{border:1.5px solid var(--bad);background:var(--bad-soft)} .slot.bad b{color:var(--bad)}
.slot.add b{color:var(--accent);font-family:var(--f-body);font-size:15px}

.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.hint{font-size:12.5px;color:var(--muted);margin:0}

.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.filterbar{display:flex;gap:8px;align-items:center}
.filterbar input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:8px 12px;font-size:13.5px;display:flex;flex-direction:column;min-width:0}
.chip b{font-family:var(--f-mono);font-size:17px;font-weight:600}
.chip small{color:var(--muted);font-size:12px}

/* inputs */
input,select,textarea{font:16px var(--f-body);color:var(--ink);background:var(--sunk);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;width:100%;min-width:0;min-height:46px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;min-height:50px;padding:0 18px;font-weight:600;font-size:16px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.sm{min-height:36px;font-size:13.5px;border-radius:10px;padding:0 12px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.5}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggles button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:42px}
.toggles button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.stepper{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:16px;padding:10px}
.stepper button{width:56px;height:56px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:26px;font-weight:600;cursor:pointer;flex:none}
.stepper input{background:none;border:0;text-align:center;font:600 36px var(--f-mono);padding:0;min-height:56px}
.stepper input:focus{background:none}
.verdict{text-align:center;font-size:13.5px;min-height:22px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:600 17px var(--f-mono);cursor:pointer}
.scale button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.scalecap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:-2px}
.scorebox{border-radius:14px;padding:12px;text-align:center;font-weight:600}
.lv-low{background:var(--good-soft);color:var(--good)}.lv-med{background:var(--warn-soft);color:var(--warn)}
.lv-high{background:var(--bad-soft);color:var(--bad)}.lv-ext{background:var(--crit-soft);color:var(--crit)}

/* bottom nav + fab */
nav.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom button{border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
nav.bottom button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.bottom button[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.bottom .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font:600 10.5px/17px var(--f-mono);padding:0 4px}
.fab{position:fixed;z-index:6;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 240px + 16px));height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;padding:0 20px 0 16px;font-weight:600;font-size:15.5px;box-shadow:0 6px 18px rgba(19,91,138,.35);cursor:pointer}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,18,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92vh;background:var(--app);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet header{display:flex;align-items:center;gap:10px;padding:8px 16px 10px}
.sheet header h2{flex:1;font-size:19px}
.sheet .body{overflow-y:auto;padding-inline:16px;padding-block:4px 16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sheet .foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--app)}
.sheet .foot .btn{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--app);padding:10px 18px;border-radius:999px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:4px}
.step .no{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 14px var(--f-mono);background:var(--sunk);color:var(--muted)}
.step.ok .no{background:var(--good);color:var(--surface)}
.step.late .no{background:var(--bad);color:var(--surface)}
.step .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.step .bd b{font-weight:600}
.step .bd .dim{font-size:13px;color:var(--muted)}
.step .btn{align-self:flex-start;margin-top:4px}
.shift{font-size:12.5px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:4px 8px;align-self:flex-start}
.weekhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.weekhd small{color:var(--muted);font-size:13px}
.card.past{border:1.5px solid var(--bad)}
.gcard{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.gcard .top{padding:14px 16px 6px;color:var(--muted);font-size:13.5px}
.gcard .top b{display:block;color:var(--ink);font:600 18px var(--f-display)}
.gbox{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.gbox .ic{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:22px;font-weight:700;background:var(--sunk);color:var(--muted)}
.gbox.ok .ic{background:var(--good-soft);color:var(--good)}
.gbox.no .ic{background:var(--bad-soft);color:var(--bad)}
.gbox .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.gbox .tx b{font-size:16px;font-weight:600}
.gbox .tx span{font-size:13px;color:var(--muted)}
.gbox .tx .who{font-size:15px;color:var(--ink);font-weight:500}
.gbox .btn{min-height:48px;padding:0 20px}
.gbox .sh{color:var(--warn)}
.ghist{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.ghist:last-child{border-bottom:0}
.ghist .d{font-weight:600;font-size:14px;line-height:1.2}
.ghist .d small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.gcell{display:flex;flex-direction:column;min-width:0}
.gcell small{color:var(--muted);font-size:11.5px}
.gcell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcell .ok{color:var(--good);font-weight:500}.gcell .bad{color:var(--bad);font-weight:500}
.gcell button{align-self:flex-start;border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:30px}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigchoice button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:600;cursor:pointer}
.bigchoice button[data-v="ผ่าน"][aria-pressed="true"]{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.bigchoice button[data-v="ไม่ผ่าน"][aria-pressed="true"]{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.signfor{background:var(--sunk);border-radius:14px;padding:12px 14px;font-size:14px}
.signfor b{display:block;font:600 17px var(--f-display)}
.namepick{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.namepick button{min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:17px;font-weight:600;cursor:pointer;text-align:left;padding:0 16px;display:flex;align-items:center;gap:12px}
.namepick button::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.namepick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.namepick button[aria-pressed="true"]::before{border:7px solid var(--accent)}
.inout{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inout .btn{min-height:60px;font-size:17px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.in{background:var(--good);color:var(--surface)}
.btn.out{background:var(--accent);color:var(--accent-ink)}
.qin{color:var(--good)}.qout{color:var(--accent)}.qadj{color:var(--warn)}
.balhint{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.balhint b{font-family:var(--f-mono)}
.mini{display:flex;flex-direction:column;gap:2px;font-size:13px}
.mini span{display:flex;justify-content:space-between;gap:8px}
.scanbtn{width:100%;min-height:64px;border-radius:16px;border:2px dashed var(--good);background:var(--good-soft);color:var(--good);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.scanbtn.out{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.photobox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:140px;border-radius:16px;border:2px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;cursor:pointer;overflow:hidden;margin-top:6px;text-align:center}
.photobox img{width:100%;max-height:280px;object-fit:cover;display:block}
.photobox svg.i{width:38px;height:38px}
.photobox.has{border-style:solid}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;border:0;padding:0;cursor:pointer;background:var(--sunk);flex:none;display:block}
.thumbbtn{border:0;padding:0;background:none;cursor:pointer}
.photolink{align-self:flex-start;border:0;background:none;color:var(--accent);font-size:12px;padding:0;cursor:pointer;text-decoration:underline}
.fullphoto{width:100%;border-radius:14px;display:block}
.scanned{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;text-align:center;background:var(--good-soft);color:var(--good)}
.scanned.out{background:var(--accent-soft);color:var(--accent)}
.scanned small{font-size:13px;opacity:.85}
.scanned b{font:700 28px var(--f-display);color:var(--ink)}
.scanned span{font-size:15px;color:var(--ink)}
.codebox{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.codebox b{font-family:var(--f-mono);font-size:16px;letter-spacing:.04em}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pickgrid button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;cursor:pointer;padding:4px 8px}
.pickgrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.codeadd{display:flex;gap:8px}
.codeadd input{flex:1}
.codeadd .btn{min-height:46px}
.codelist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.codelist:empty{display:none}
.codeitem{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:10px;padding:6px 6px 6px 12px;font:500 15px var(--f-mono)}
.codeitem .n{color:var(--muted);font-size:12px;width:22px}
.codeitem span.c{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.codeitem button{border:0;background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--bad);font-size:18px}
.qtyauto{font-size:12.5px;color:var(--good);font-weight:500}

/* ===== Modern skin: section colors match the LINE rich menu (temp blue, grease green, stock orange) ===== */
:root{
  --bg:#E8EEF3; --app:#F3F6F9; --surface:#FFFFFF; --sunk:#EEF2F6; --ink:#121B22; --muted:#5F6E78; --line:#DCE3E9;
  --accent:#17598F; --accent-2:#2C7DBF; --accent-soft:#E2EDF7;
  --c-temp:#2C7DBF; --c-temp-2:#17598F; --c-temp-soft:#E1EEF9;
  --c-grease:#139178; --c-grease-2:#0C6E5A; --c-grease-soft:#DDF3EC;
  --c-seas:#E07E14; --c-seas-2:#B45606; --c-seas-soft:#FCEBD8;
  --glass:rgba(255,255,255,.84); --glass-line:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(16,40,60,.05),0 8px 24px rgba(16,40,60,.07);
  --shadow-lg:0 14px 40px rgba(16,40,60,.16);
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090E12; --app:#0F151A; --surface:#172027; --sunk:#121A20; --ink:#E7EEF2; --muted:#93A3AD; --line:#26323A;
  --accent:#6DB0DD; --accent-2:#4A97CC; --accent-soft:#16304A;
  --c-temp:#5AA6E0; --c-temp-2:#2C7DBF; --c-temp-soft:#15304A;
  --c-grease:#3CC4A2; --c-grease-2:#139178; --c-grease-soft:#11342C;
  --c-seas:#F2A04A; --c-seas-2:#D9740F; --c-seas-soft:#3A2814;
  --glass:rgba(23,32,39,.86); --glass-line:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 14px 40px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#090E12; --app:#0F151A; --surface:#172027; --sunk:#121A20; --ink:#E7EEF2; --muted:#93A3AD; --line:#26323A;
  --accent:#6DB0DD; --accent-2:#4A97CC; --accent-soft:#16304A;
  --c-temp:#5AA6E0; --c-temp-2:#2C7DBF; --c-temp-soft:#15304A;
  --c-grease:#3CC4A2; --c-grease-2:#139178; --c-grease-soft:#11342C;
  --c-seas:#F2A04A; --c-seas-2:#D9740F; --c-seas-soft:#3A2814;
  --glass:rgba(23,32,39,.86); --glass-line:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 14px 40px rgba(0,0,0,.5);
}
body{background:var(--bg)}
.app{background:radial-gradient(120% 60% at 100% 0%,var(--accent-soft) 0%,transparent 55%),var(--app);padding-bottom:calc(var(--nav-h) + 44px + env(safe-area-inset-bottom,0px))}
.appbar{background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);padding:14px 16px 12px}
.appbar h1{font-size:24px;letter-spacing:-.01em}
.brand{letter-spacing:.14em;font-size:11px}
.iconbtn{border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.screen{gap:18px}
.sec-h h2{font-size:17px}

/* hero */
.hello{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 22px;background:linear-gradient(135deg,#123F66 0%,#17598F 45%,#2C8BC4 100%);color:#fff;box-shadow:0 16px 34px rgba(23,89,143,.28)}
.hello::before,.hello::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10)}
.hello::before{width:180px;height:180px;right:-50px;top:-70px}
.hello::after{width:110px;height:110px;right:60px;bottom:-60px;background:rgba(255,255,255,.07)}
.hello .d{opacity:.8;position:relative}
.hello .big{font-size:26px;position:relative}

/* tiles */
.tiles{gap:12px}
.tile{border-radius:22px;padding:16px;border:1px solid var(--line);gap:8px;transition:transform .15s ease,box-shadow .15s ease}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.tile .ic{width:44px;height:44px;border-radius:14px}
.tile .val{font-size:22px}
.tile[data-go="temp"] .ic{background:var(--c-temp-soft);color:var(--c-temp)}
.tile[data-go="grease"] .ic{background:var(--c-grease-soft);color:var(--c-grease)}
.tile[data-go="seas"] .ic{background:var(--c-seas-soft);color:var(--c-seas)}
.tiles>.tile:first-child{flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px 14px;background:linear-gradient(135deg,var(--surface) 55%,var(--c-temp-soft))}
.tiles>.tile:first-child .lab{flex:1;min-width:120px}

/* surfaces */
.card,.list,.cab,.gcard,.todo{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
.chip{border-radius:16px;border:1px solid var(--line);padding:10px 14px}
.chip b{font-size:19px}
.daylbl{background:transparent;padding:14px 16px 6px;font-size:12px;letter-spacing:.04em;text-transform:none}
.item>button.main{padding:13px 16px}
.pill{padding:2px 10px}

/* section accents */
#s-temp .cab{border-top:4px solid var(--c-temp)}
#s-grease .gcard{border-top:4px solid var(--c-grease)}
#s-grease .gbox .btn.primary{background:linear-gradient(135deg,#17977C,#0C6E5A);color:#fff}
#s-seas .list{border-top:4px solid var(--c-seas)}
.slot{border-radius:16px;min-height:84px}
.slot.add{border-color:var(--c-temp);background:var(--c-temp-soft)}
.slot.add b{color:var(--c-temp)}

/* inputs & controls */
input,select,textarea{border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 4px var(--accent-soft)}
.stepper input:focus{box-shadow:none}
.seg{border-radius:16px;padding:4px;background:var(--sunk);border:1px solid var(--line)}
.seg button{border-radius:12px}
.btn{border-radius:16px}
.btn.primary{color:#fff;background:linear-gradient(135deg,#2C7DBF,#17598F);box-shadow:0 6px 16px rgba(23,89,143,.25)}
.btn.in{background:linear-gradient(135deg,#17977C,#0C6E5A);color:#fff;box-shadow:0 6px 16px rgba(19,145,120,.25)}
.btn.out{background:linear-gradient(135deg,#2C7DBF,#17598F);color:#fff}
.scanbtn{border-radius:18px}
.scanbtn.out{border-color:var(--c-seas);background:var(--c-seas-soft);color:var(--c-seas-2)}
.namepick button,.bigchoice button,.pickgrid button,.toggles button{border-radius:16px}

/* floating bottom nav */
nav.bottom{bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:456px;border-radius:26px;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);box-shadow:var(--shadow-lg);padding:4px;padding-bottom:4px}
nav.bottom button{height:var(--nav-h);border-radius:20px;gap:4px;font-size:11.5px}
nav.bottom button[aria-current="page"]::before{display:none}
nav.bottom button svg.i{box-sizing:content-box;padding:4px 16px;border-radius:999px;transition:background .15s}
nav.bottom button[aria-current="page"] svg.i{background:var(--accent-soft)}
nav.bottom button[data-go="temp"][aria-current="page"]{color:var(--c-temp)}
nav.bottom button[data-go="temp"][aria-current="page"] svg.i{background:var(--c-temp-soft)}
nav.bottom button[data-go="grease"][aria-current="page"]{color:var(--c-grease)}
nav.bottom button[data-go="grease"][aria-current="page"] svg.i{background:var(--c-grease-soft)}
nav.bottom button[data-go="seas"][aria-current="page"]{color:var(--c-seas)}
nav.bottom button[data-go="seas"][aria-current="page"] svg.i{background:var(--c-seas-soft)}
nav.bottom .badge{top:6px;left:calc(50% + 10px);box-shadow:0 0 0 2px var(--surface)}
.fab{bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));border-radius:20px;color:#fff;background:linear-gradient(135deg,#2C7DBF,#17598F);box-shadow:0 10px 24px rgba(23,89,143,.35)}

/* sheet */
.scrim{background:rgba(8,16,24,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet .grab{width:44px;margin-top:10px}
.sheet header h2{font-size:20px}
.sheet .foot{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.toast{bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));border-radius:16px;box-shadow:var(--shadow-lg)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}

/* ===== GitHub version: connection banner, live camera scanner, PIN ===== */
a.iconbtn{text-decoration:none}
.banner a{color:inherit;font-weight:600}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
button.scanbig{width:100%;font:inherit;font-weight:600;font-size:17px}
.scanalt{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;background:var(--sunk);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;width:100%}
.scanalt svg.i{width:20px;height:20px}
.cam{position:fixed;inset:0;z-index:25;background:#000;display:flex;flex-direction:column;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;left:8%;right:8%;top:32%;height:24%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);transition:border-color .15s}
.cam .frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:rgba(240,122,108,.85)}
.cam .frame.hit{border-color:#3CC4A2}
.cam .frame.miss{border-color:#F07A6C}
.cam .ctop{position:relative;z-index:1;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 12px;color:#fff;display:flex;flex-direction:column;gap:4px;text-align:center}
.cam .ctop b{font:600 20px var(--f-display)}
.cam .ctop span{font-size:14.5px;opacity:.92;min-height:22px}
.cam .ccount{position:absolute;left:50%;transform:translateX(-50%);top:calc(56% + 14px);z-index:1;background:#139178;color:#fff;font:600 18px var(--f-display);padding:8px 20px;border-radius:999px;white-space:nowrap}
.cam .cbar{margin-top:auto;position:relative;z-index:1;display:grid;grid-template-columns:1fr 1.3fr;gap:10px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.cam .cbar .btn{min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center}
.cam .cbar .btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.pinwrap{position:fixed;inset:0;z-index:40;background:var(--app);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.pinbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
.pinbox h2{font-size:26px}
.pinbox input{text-align:center;font:600 28px var(--f-mono);letter-spacing:.3em}
.pinbox .err{color:var(--bad);font-weight:600}
</style>
</head>

/* ---------- navigation ---------- */

addEventListener('scroll',()=>$('#appbar').classList.toggle('scrolled',scrollY>4),{passive:true});
['#tMonth','#sMonth','#tChartMonth','#gMonth'].forEach(s=>{$(s).value=mKey(now());$(s).onchange=renderAll});

/* ---------- list item toggle / delete / status ---------- */
document.addEventListener('click',async e=>{
  const m=e.target.closest('button.main[data-key]');
  if(m){S.open=S.open===m.dataset.key?null:m.dataset.key;renderAll();return}

      if(d.dataset.del==='stock_moves'){const mv=S.moves.find(m=>m._id===d.dataset.id);if(mv){const ref=S.db.collection('stock_items').doc(mv.itemId);const sn=await ref.get();if(sn.exists){const b=+sn.data().bal||0;const nb=mv.type==='in'?b-mv.qty:mv.type==='out'?b+mv.qty:(mv.prev!=null?b-(mv.diff||0):b);await ref.update({bal:Math.round(nb*100)/100})}}}
      await S.db.collection(d.dataset.del).doc(d.dataset.id).delete();S.open=null;if(d.dataset.del==='stock_items')closeSheet();toast('ลบแล้ว')}catch(err){toast('ลบไม่สำเร็จ')}
  }

  if(t){const[k,a,b]=t.dataset.todo.split('|');go(k);if(k==='temp')openSheet('temp',{cab:a,slot:b});else if(k==='grease')openSheet('grease');}

function moreBlock(col,id,inner){return `<div class="more">${inner}<div class="acts"><button class="btn sm danger" type="button" data-del="${col}" data-id="${esc(id)}">ลบรายการนี้</button></div></div>`}

/* ---------- render: home ---------- */
function renderHome(){
  const n=now(),today=dKey(n);
  $('#hDate').textContent=n.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const h=n.getHours();$('#hBig').textContent=(h<12?'สวัสดีตอนเช้า':h<17?'สวัสดีตอนบ่าย':'สวัสดีตอนเย็น')+(who()?' คุณ'+who():'');
  // tiles
  const tT=S.temps.filter(r=>r.date===today);const need=S.settings.cabinets.reduce((a,c)=>a+cabSlots(c).length,0);const done=new Set(tT.map(r=>r.cab+r.slot)).size;const bad=tT.filter(r=>!inRange(r)).length;

  {const w=curWeek(),r=weekRec(w),due=inspDue(w);
  $('#tlGrease').textContent=r&&r.cleanBy?'ล้างแล้ว':today<w?'ยังไม่ถึงวัน':'ยังไม่ลงชื่อ';

  {const low=S.items.filter(isLow).length;$('#tlSeas').textContent=`${S.items.length} รายการ`;$('#tlSeasS').innerHTML=!S.items.length?'<span class="pill none">ยังไม่มีของในสต๊อก</span>':low?`<span class="pill bad">ใกล้หมด ${low}</span>`:'<span class="pill good">เพียงพอ</span>';}
  // recent
}

/* ---------- render: temp ---------- */
function renderTemp(){
  const today=dKey(now());
  $('#tToday').innerHTML=S.settings.cabinets.map(c=>`<div class="cab"><div class="head"><strong>${esc(c.name)}</strong><small class="num">เกณฑ์ ${c.min} ถึง ${c.max} °C</small></div><div class="slots${cabSlots(c).length===1?' one':''}">${cabSlots(c).map(sl=>{
    const r=S.temps.find(x=>x.cab===c.id&&x.date===today&&x.slot===sl);
    if(!r)return `<button class="slot add" type="button" data-addtemp="${c.id}|${sl}"><span>${slotLbl(sl)}</span><b>+ บันทึก</b></button>`;
    const ok=inRange(r);return `<button class="slot ${ok?'good':'bad'}" type="button" data-addtemp="${c.id}|${sl}"><span>${slotLbl(sl)} · ${esc(r.time)} น.</span><b>${r.val.toFixed(1)}°</b><span>${ok?'ผ่าน':'เกินเกณฑ์'}</span></button>`}).join('')}</div></div>`).join('');
  $$('[data-addtemp]').forEach(b=>b.onclick=()=>{const[c,s]=b.dataset.addtemp.split('|');openSheet('temp',{cab:c,slot:s})});
  if(!cabById(S.chartCab))S.chartCab=S.settings.cabinets[0].id;

  renderChart();
  const m=$('#tMonth').value;const rows=S.temps.filter(r=>!m||r.date.startsWith(m));
  $('#tList').innerHTML=rows.length?groupByDay(rows,r=>{const ok=inRange(r),key='t'+r._id;return `<div class="item"><button class="main" data-key="${key}"><span class="lead" style="color:${ok?'var(--good)':'var(--bad)'}">${r.val.toFixed(1)}°<small>${ok?'ผ่าน':'เกินเกณฑ์'}</small></span><span class="mid"><b>${esc(r.cabName)}</b><span>${esc(slotLbl(r.slot))} · ${esc(r.time)} น. · ${esc(r.who)}</span></span></button>${S.open===key?moreBlock('temps',r._id,`<p>เกณฑ์ขณะบันทึก ${r.min} ถึง ${r.max} °C</p>${r.note?`<p>หมายเหตุ: ${esc(r.note)}</p>`:''}`):''}</div>`}):'<div class="empty">ยังไม่มีบันทึกในเดือนนี้</div>';
}
function renderChart(){
  const c=cabById(S.chartCab);const W=340,H=170,L=28,R=8,T=10,B=22;
  const [cy,cm]=($('#tChartMonth').value||mKey(now())).split('-').map(Number);const start=new Date(cy,cm-1,1),end=new Date(cy,cm,1),nd=new Date(cy,cm,0).getDate();
  const pts=S.temps.filter(r=>r.cab===c.id).map(r=>({t:new Date(r.date+'T'+(r.time||'00:00')),v:r.val,ok:inRange(r)})).filter(p=>p.t>=start&&p.t<=end).sort((a,b)=>a.t-b.t);
  let lo=Math.floor(Math.min(c.min-2,...pts.map(p=>p.v))),hi=Math.ceil(Math.max(c.max+2,...pts.map(p=>p.v)));if(hi-lo<4)hi=lo+4;
  const x=t=>L+(t-start)/(end-start)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);const step=Math.max(1,Math.ceil((hi-lo)/5));
  let g='';for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  let xl='';for(const dd of [1,5,10,15,20,25,nd]){const d=new Date(cy,cm-1,dd,12);xl+=`<text x="${x(d)}" y="${H-6}" text-anchor="middle">${dd}</text>`}
  const band=`<rect x="${L}" width="${W-L-R}" y="${y(c.max)}" height="${y(c.min)-y(c.max)}" fill="var(--good-soft)"/>`;
  const line=pts.length>1?`<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts.map(p=>x(p.t).toFixed(1)+','+y(p.v).toFixed(1)).join(' ')}"/>`:'';

  const data=cabs.map(c=>({c,d:byDay(c)}));

    g.fillStyle=C.band;g.fillRect(L,yv(c.max),R-L,yv(c.min)-yv(c.max));
    const step=Math.max(1,Math.ceil((hi-lo)/6));g.font=`500 16px ${FM}`;g.textAlign='right';
    for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){g.strokeStyle=C.line;g.lineWidth=1;g.beginPath();g.moveTo(L,yv(v));g.lineTo(R,yv(v));g.stroke();g.fillStyle=C.mut;g.fillText(v+'°',L-12,yv(v)+5)}

    pts.forEach(dd=>{const r=d[dd],ok=inRange(r);g.fillStyle=ok?C.acc:C.bad;g.beginPath();g.arc(x(dd),yv(r.val),ok?6:9,0,Math.PI*2);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();

      cx+=150;g.font=`500 15px ${FB}`;g.fillStyle=C.mut;if(r)g.fillText(String(r.who||'').slice(0,26),cx+10,ry+rowH-9);cx+=cols[2].w});
  }
  g.strokeStyle=C.line;g.lineWidth=1;g.strokeRect(60,tTop,W-120,rowH*(nd+1));
  // footer
  const fy=tTop+rowH*(nd+1)+70;g.font=`500 20px ${FB}`;g.fillStyle=C.ink;
  g.fillText('ลงชื่อ ...................................................... ผู้ตรวจสอบ',60,fy);

  return cv;
}

/* ---------- barcode ---------- */
let zxP=null;
function loadZX(){return zxP||(zxP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';sc.onload=()=>res(window.ZXing);sc.onerror=()=>{zxP=null;rej(new Error('load'))};document.head.appendChild(sc)}))}
async function decodeFile(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    if('BarcodeDetector' in window){try{const det=new BarcodeDetector();const r=await det.detect(img);if(r&&r[0])return r[0].rawValue}catch(e){}}
    const Z=await loadZX();
    const sc=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));
    const W=Math.round(img.naturalWidth*sc),H=Math.round(img.naturalHeight*sc);
    const cv=document.createElement('canvas');const cx=cv.getContext('2d',{willReadFrequently:true});
    const reader=new Z.MultiFormatReader();const hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);reader.setHints(hints);
    for(const rot of [0,90]){
      cv.width=rot?H:W;cv.height=rot?W:H;cx.save();if(rot){cx.translate(H,0);cx.rotate(Math.PI/2)}cx.drawImage(img,0,0,W,H);cx.restore();
      const px=cx.getImageData(0,0,cv.width,cv.height).data,lum=new Uint8ClampedArray(cv.width*cv.height);
      for(let i=0,j=0;j<lum.length;i+=4,j++)lum[j]=(px[i]*299+px[i+1]*587+px[i+2]*114)/1000;
      try{const bb=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum,cv.width,cv.height)));return reader.decode(bb).getText()}catch(e){reader.reset()}
    }
    return null;
  }finally{URL.revokeObjectURL(url)}
}

/* ---------- live camera scanner ---------- */
const CAM={stream:null,timer:0,mode:'once',onCode:null,onDone:null,hold:false,seen:0,det:undefined,zx:null,zxHints:null};
const camCv=document.createElement('canvas'),camCx=camCv.getContext('2d',{willReadFrequently:true});
async function camDecode(){
  if(CAM.det===undefined){CAM.det=null;if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f&&f.length)CAM.det=new BarcodeDetector()}catch(e){}}}
  if(CAM.det){try{const r=await CAM.det.detect(camCv);return r&&r[0]?r[0].rawValue:null}catch(e){return null}}
  const Z=await loadZX();
  if(!CAM.zx){CAM.zx=new Z.MultiFormatReader();const h=new Map();h.set(Z.DecodeHintType.TRY_HARDER,true);CAM.zx.setHints(h)}
  const w=camCv.width,h=camCv.height,px=camCx.getImageData(0,0,w,h).data,lum=new Uint8ClampedArray(w*h);
  for(let i=0,j=0;j<lum.length;i+=4,j++)lum[j]=(px[i]*299+px[i+1]*587+px[i+2]*114)/1000;
  try{return CAM.zx.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum,w,h)))).getText()}catch(e){CAM.zx.reset();return null}
}
function camMsg(t){$('#camMsg').textContent=t}
function camFlash(ok){const f=$('#camFrame');f.classList.remove('hit','miss');f.classList.add(ok?'hit':'miss');clearTimeout(camFlash.h);camFlash.h=setTimeout(()=>f.classList.remove('hit','miss'),600)}
function camSeen(code){
  const t=Date.now();
  if(code){
    CAM.seen=t;if(CAM.hold)return;CAM.hold=true;
    if(CAM.mode==='once'){const cb=CAM.onCode;camClose();cb(code);return}
    const total=CAM.onCode(code);
    if(total){camFlash(true);camMsg(`✓ ${code} · เอาออกจากกรอบแล้วเล็งชิ้นถัดไป`);$('#camCount').textContent=`สแกนแล้วรวม ${total} ชิ้น`;$('#camCount').hidden=false;try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}}
    else camFlash(false);
  }else if(CAM.hold&&t-CAM.seen>700){CAM.hold=false;if(CAM.mode!=='once')camMsg('เล็งบาร์โค้ดชิ้นถัดไป ถือนิ่งจะนับ 1 ชิ้น')}
}
async function camTick(){
  if(!CAM.stream)return;
  const v=$('#camVid');
  if(v.readyState>=2&&v.videoWidth){
    const sc=Math.min(1,800/Math.max(v.videoWidth,v.videoHeight));
    camCv.width=Math.round(v.videoWidth*sc);camCv.height=Math.round(v.videoHeight*sc);
    camCx.drawImage(v,0,0,camCv.width,camCv.height);
    let code=null;try{code=await camDecode()}catch(e){}
    if(!CAM.stream)return;

  }

function pushCode(c){
  c=String(c||'').replace(/\s+/g,'');if(!c)return false;

  if(owner&&sel&&sel!=='__new'&&owner._id!==sel){toast(`บาร์โค้ดนี้เป็นของ ${owner.name}`);return false}

}
function addCode(){

    ${field('เพิ่มวันหยุดเอง (บรรทัดละ 1 วัน รูปแบบ ปี ค.ศ.-เดือน-วัน ชื่อวันหยุด)',`<textarea id="fHol" rows="6" placeholder="2027-02-22 ชดเชยวันมาฆบูชา">${esc((S.settings.holidays||[]).map(h=>h.d+' '+h.n).join('\n'))}</textarea>`)}`;

    wireSeg('fCab',upd);wireSeg('fSlot');wireSeg('fRec');$('#fVal').oninput=upd;
    const bump=dv=>{const c=cabById(segVal('fCab'));let v=parseFloat($('#fVal').value);if(!isFinite(v))v=(c.min+c.max)/2;$('#fVal').value=(Math.round((v+dv)*10)/10).toFixed(1);upd()};

  }
  if(kind==='clean'){wireSeg('fCleaner');sheetPhoto=null;
    $('#fCleanPhoto').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;$('#fPhotoMsg').textContent='กำลังเตรียมรูป…';
      try{const d=await compressPhoto(f);if(!d){$('#fPhotoMsg').textContent='รูปใหญ่เกินไป ลองถ่ายใหม่';return}sheetPhoto=d;$('#fCleanPrev').src=d;$('#fCleanPrev').hidden=false;$('#fCleanPh').hidden=true;$('#fPhotoBox').classList.add('has');$('#fPhotoMsg').textContent='แตะรูปเพื่อถ่ายใหม่'}
      catch(err){$('#fPhotoMsg').textContent='เปิดรูปนี้ไม่ได้ ลองถ่ายใหม่'}e.target.value=''};}
  if(kind==='insp')wireSeg('fInsp');
  if(kind==='insp')wireSeg('fRes',()=>{$('#fNoteWrap').hidden=segVal('fRes')==='ผ่าน'});
  if(kind==='scan'){
    $$('#fScanPick button').forEach(b=>b.onclick=()=>{scanFor=b.dataset.v;$$('#fScanPick button').forEach(x=>x.setAttribute('aria-pressed',x===b));const it=S.items.find(i=>i._id===scanFor);$('#shTitle').textContent=`สแกน${scanType==='in'?'รับ':'เบิก'} ${it.name}`});
    $('#fPhoto').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;$('#scanMsg').innerHTML='<span class="pill none">กำลังอ่านบาร์โค้ด…</span>';
      try{const c=await decodeFile(f);if(c)handleCode(c);else $('#scanMsg').innerHTML='<span class="pill bad">อ่านบาร์โค้ดไม่ได้ ลองถ่ายใหม่ให้ใกล้และชัดขึ้น หรือพิมพ์เลขแทน</span>'}
      catch(err){$('#scanMsg').innerHTML='<span class="pill bad">อ่านรูปไม่ได้ ลองถ่ายใหม่ หรือพิมพ์เลขแทน</span>'}
      e.target.value=''};
    $('#fLive').onclick=()=>camOpen({title:$('#shTitle').textContent,mode:'once',onCode:handleCode,photoFor:'fPhoto'});
    setTimeout(()=>{try{$('#fCode').focus({preventScroll:true})}catch(e){}},250);
  }
  if(kind==='move'){
    const upd=()=>{const t=segVal('fType'),sel=$('#fItemSel').value,isNew=sel==='__new';
      $('#newItem').hidden=!isNew;$('#newItem').style.display=isNew?'flex':'none';
      $('#fRefWrap').hidden=t==='in';$('#outWhoWrap').hidden=t!=='out';$('#inCodeWrap').hidden=t!=='in';$('#noteWrap').hidden=t==='in';
      const it=S.items.find(i=>i._id===sel);
      if($('#fPick'))$$('#fPick button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===sel));
      $('#fBal').innerHTML=!sel?'<span>ยังไม่ได้เลือกรายการ</span><b>–</b>':isNew?'<span>รายการใหม่</span><b>0</b>':`<span>คงเหลือตอนนี้</span><b>${fmtQ(it.bal||0)} ${esc(it.unit)}</b>`;
      $('#shSubmit').textContent=t==='in'?'บันทึกรับเข้า':'บันทึกเบิกออก'};
    inCodes=pre.code&&(pre.type||'in')==='in'?[pre.code]:[];if((pre.type||'in')==='in'&&!pre.code)setTimeout(function(){try{$('#fCodeIn').focus({preventScroll:true})}catch(e){}},350);$('#fCodeAdd').onclick=addCode;
    $('#fCodePhoto').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const m=$('#fCodeMsg');m.innerHTML='<span class="pill none">กำลังอ่านบาร์โค้ด…</span>';
      try{const c=await decodeFile(f);if(c){$('#fCodeIn').value=c;const n=inCodes.length;addCode();m.innerHTML=inCodes.length>n?`<span class="pill good">เพิ่ม ${esc(c)} แล้ว · แตะถ่ายชิ้นถัดไปได้เลย</span>`:''}else m.innerHTML='<span class="pill bad">อ่านไม่ได้ ถ่ายใกล้ขึ้น หรือพิมพ์เลขแทน</span>'}
      catch(err){m.innerHTML='<span class="pill bad">อ่านรูปไม่ได้ ลองถ่ายใหม่</span>'}e.target.value=''};
    $('#fLiveIn').onclick=()=>camOpen({title:'สแกนรับเข้า',mode:'count',onCode:c=>pushCode(c)&&inCodes.length,photoFor:'fCodePhoto',
      onDone:()=>{$('#fCodeMsg').innerHTML=inCodes.length?`<span class="pill good">มีบาร์โค้ดแล้ว ${inCodes.length} ชิ้น</span>`:''}});
    $('#fCodeIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCode()}});renderCodes();
    wireSeg('fType',upd);wireSeg('fOutWho');$('#fItemSel').onchange=upd;$$('#fPick button').forEach(b=>b.onclick=()=>{$('#fItemSel').value=b.dataset.v;upd()});upd();
  }
}
function closeSheet(){if(!$('#cam').hidden)camClose();$('#scrim').hidden=true;document.body.classList.remove('lock');sheetKind=null}

$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#cam').hidden)camClose();else if(sheetKind)closeSheet()});

/* ---------- data ---------- */
async function addRec(col,data){
  if(!S.db){toast('ยังเชื่อมต่อฐานข้อมูลไม่ได้ ข้อมูลยังไม่ถูกบันทึก');return false}
  if(!S.canWrite){toast('บัญชีนี้มีสิทธิ์ดูอย่างเดียว');return false}
  try{await S.db.collection(col).add({...data,createdAt:new Date().toISOString()});return true}
  catch(e){toast(e&&e.code==='quota_exceeded'?'พื้นที่เก็บข้อมูลเต็ม กรุณาลบบันทึกเก่า':e&&e.code==='invalid_argument'?'บัญชีนี้ไม่มีสิทธิ์บันทึก':'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');return false}
}
async function writeWeek(w,f){
  if(!S.db){toast('ยังเชื่อมต่อฐานข้อมูลไม่ได้ ข้อมูลยังไม่ถูกบันทึก');return false}
  if(!S.canWrite){toast('บัญชีนี้มีสิทธิ์ดูอย่างเดียว');return false}
  const ref=S.db.collection('grease_weeks').doc(w);
  try{const snap=await ref.get();if(snap.exists)await ref.update({...f,inspDue:inspDue(w)});else await ref.set({week:w,ts:w,cleanDue:w,inspDue:inspDue(w),...f});return true}
  catch(e){toast(e&&e.code==='invalid_argument'?'บัญชีนี้ไม่มีสิทธิ์บันทึก':'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');return false}
}
async function saveSettings(patch){S.settings={...S.settings,...patch};renderAll();if(!S.db)return true;try{await S.db.doc('settings/main').set(S.settings);return true}catch(e){toast('บันทึกการตั้งค่าไม่สำเร็จ');return false}}
const val=id=>($('#'+id)?.value||'').trim();
function need(ids){for(const[id,msg]of ids){if(!val(id)){toast(msg);$('#'+id).focus();return false}}return true}

$('#shForm').onsubmit=async e=>{
  e.preventDefault();const k=sheetKind;let ok=false,msg='บันทึกแล้ว';
  const btn=$('#shSubmit');
  if(k==='temp'){
    const c=cabById(segVal('fCab')),v=parseFloat($('#fVal').value);
    if(!isFinite(v)){toast('กรอกอุณหภูมิก่อนบันทึก');$('#fVal').focus();return}
    const out=v<c.min||v>c.max;if(out&&!val('fNote')){toast('อุณหภูมิเกินเกณฑ์ กรุณาระบุการแก้ไข');$('#fNote').focus();return}
    if(!segVal('fRec')){toast('เลือกชื่อผู้บันทึก');return}
    lsSet('kw_rec',segVal('fRec'));
    btn.disabled=true;ok=await addRec('temps',{date:val('fDate'),time:val('fTime'),ts:val('fDate')+'T'+val('fTime'),slot:cabSlots(c).length===1?'ประจำวัน':segVal('fSlot'),cab:c.id,cabName:c.name,val:v,min:c.min,max:c.max,who:segVal('fRec'),note:val('fNote')});msg=out?'บันทึกแล้ว (เกินเกณฑ์)':'บันทึกอุณหภูมิแล้ว';
  }else if(k==='clean'||k==='insp'){
    if(k==='clean'&&!segVal('fCleaner')){toast('เลือกชื่อผู้ทำความสะอาด');return}
    if(k==='clean'&&!sheetPhoto){toast('ถ่ายรูปบ่อหลังทำความสะอาดก่อนลงชื่อ');return}
    if(k==='insp'&&!segVal('fInsp')){toast('เลือกชื่อผู้ตรวจ');return}
    const w=sheetWeek,nowD=now();let f;
    if(k==='clean'){lsSet('kw_cleaner',segVal('fCleaner'));f={hasPhoto:true,cleanBy:segVal('fCleaner'),cleanAt:dKey(nowD),cleanTime:tKey(nowD),cleanSigned:nowD.toISOString()};msg='ลงชื่อทำความสะอาดแล้ว'}
    else{const res=segVal('fRes');if(res==='ไม่ผ่าน'&&!val('fNote')){toast('ระบุสิ่งที่ต้องแก้ไข');$('#fNote').focus();return}
      const ip=INSPECTORS[+segVal('fInsp')];lsSet('kw_insp',segVal('fInsp'));f={inspBy:ip.n,inspPos:ip.p,inspAt:dKey(nowD),inspResult:res,inspNote:res==='ผ่าน'?'':val('fNote'),inspSigned:nowD.toISOString()};msg='ลงชื่อผู้ตรวจแล้ว'}
    btn.disabled=true;
    if(k==='clean'){try{await S.db.doc('grease_photos/'+w).set({week:w,img:sheetPhoto,at:new Date().toISOString(),by:f.cleanBy});PH[w]=sheetPhoto}catch(e){toast('อัปโหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง');btn.disabled=false;return}}
    ok=await writeWeek(w,f);
  }else if(k==='scan'){
    handleCode(val('fCode'));return;
  }else if(k==='move'){
    if(segVal('fType')==='in'&&val('fCodeIn'))addCode();
    const t=segVal('fType'),sel=$('#fItemSel').value,q=parseFloat(val('fQty'));
    if(!sel){toast('เลือกรายการที่ตรงกับบาร์โค้ดนี้');return}
    if(sel==='__new'&&t==='out'){toast('รายการใหม่ต้องรับเข้าก่อนจึงจะเบิกได้');return}
    if(sel==='__new'&&!need([['fNewName','พิมพ์ชื่อเครื่องปรุง']]))return;
    if(!(q>0)){toast('กรอกจำนวนให้มากกว่า 0');$('#fQty').focus();return}
    if(t==='out'&&!segVal('fOutWho')){toast('เลือกชื่อผู้เบิก');return}
    const mwho=t==='out'?segVal('fOutWho'):'';if(t==='out')lsSet('kw_out',mwho);
    if(!S.db){toast('ยังเชื่อมต่อฐานข้อมูลไม่ได้');return}
    const mcodes=[...new Set(t==='in'?inCodes:(sheetCode?[sheetCode]:[]))];
    btn.disabled=true;
    try{
      let ref,name,unit;
      if(sel==='__new'){name=val('fNewName');const ex=S.items.find(i=>i.name===name);
        if(ex){ref=S.db.collection('stock_items').doc(ex._id);unit=ex.unit}
        else{ref=S.db.collection('stock_items').doc();unit=val('fNewUnit');await ref.set({name,unit,min:parseFloat(val('fNewMin'))||0,bal:0,ts:'z'+name,order:100+S.items.length,codes:mcodes})}}
      else{ref=S.db.collection('stock_items').doc(sel);const it=S.items.find(i=>i._id===sel);name=it.name;unit=it.unit}
      const snap=await ref.get();const bal=+(snap.data()?.bal)||0;
      if(t==='out'&&q>bal+1e-9){toast(`เบิกเกินคงเหลือ (เหลือ ${fmtQ(bal)} ${unit})`);btn.disabled=false;return}
      const nb=Math.round((bal+(t==='in'?q:-q))*100)/100;
      await S.db.collection('stock_moves').add({date:val('fDate'),ts:val('fDate')+'T'+tKey(now()),type:t,itemId:ref.id,item:name,unit,qty:q,balAfter:nb,ref:t==='out'?val('fRef'):'',who:mwho,note:t==='in'?'':val('fNote'),createdAt:new Date().toISOString()});
      const curCodes=(snap.data()?.codes)||[];
      const addC=mcodes.filter(c=>!curCodes.includes(c));
      await ref.update(addC.length?{bal:nb,codes:[...curCodes,...addC]}:{bal:nb});
      ok=true;msg=t==='in'?`รับ${name}เข้า ${fmtQ(q)} ${unit}`:`เบิก${name} ${fmtQ(q)} ${unit} · เหลือ ${fmtQ(nb)}`;
    }catch(e){toast(e&&e.code==='invalid_argument'?'บัญชีนี้ไม่มีสิทธิ์บันทึก':'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง')}
  }else if(k==='item'){
    const it=sheetItem;if(!need([['fName','พิมพ์ชื่อเครื่องปรุง']]))return;
    const cnt=val('fCount');if(cnt!==''&&!need([['fWho','กรอกชื่อผู้นับ']]))return;
    btn.disabled=true;
    try{const ref=S.db.collection('stock_items').doc(it._id);
      const patch={name:val('fName'),unit:val('fUnit'),min:parseFloat(val('fMin'))||0,codes:val('fCodes').split(/[,\s]+/).filter(Boolean)};
      if(cnt!==''){const c=Math.max(0,parseFloat(cnt)||0);const cur=+((await ref.get()).data()?.bal)||0;
        if(c!==cur){await S.db.collection('stock_moves').add({date:dKey(now()),ts:dKey(now())+'T'+tKey(now()),type:'adj',itemId:it._id,item:patch.name,unit:patch.unit,qty:c,diff:Math.round((c-cur)*100)/100,prev:cur,balAfter:c,ref:'นับสต๊อก',who:val('fWho'),note:`ยอดเดิม ${fmtQ(cur)} → นับได้ ${fmtQ(c)}`,createdAt:new Date().toISOString()});patch.bal=c}}
      await ref.update(patch);ok=true;msg='บันทึกแล้ว';
    }catch(e){toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง')}
  }else if(k==='report'){
    if(!sheetReport)return;
    if(downloads){const blob=await new Promise(r=>sheetReport.cv.toBlob(r,'image/png'));try{await downloads.save({filename:sheetReport.name,data:blob});toast('บันทึกรายงานแล้ว')}catch(e){}}
    else toast('กดค้างที่รูปเพื่อบันทึกรูปภาพ');return;
  }else if(k==='settings-temp'){
    const cabs=S.settings.cabinets.map(c=>({id:c.id,name:val('rn-'+c.id)||c.name,min:parseFloat(val('rmin-'+c.id)),max:parseFloat(val('rmax-'+c.id))}));
    if(cabs.some(c=>!isFinite(c.min)||!isFinite(c.max)||c.min>=c.max)){toast('ค่าต่ำสุดต้องน้อยกว่าค่าสูงสุด');return}
    btn.disabled=true;ok=await saveSettings({cabinets:cabs});msg='บันทึกเกณฑ์แล้ว';
  }else if(k==='settings-grease'){
    const lines=val('fHol').split('\n').map(x=>x.trim()).filter(Boolean),hol=[];
    for(const ln of lines){const m=ln.match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/);if(!m||isNaN(new Date(m[1]+'T00:00'))){toast('รูปแบบไม่ถูกต้อง: '+ln);return}hol.push({d:m[1],n:m[2]||'วันหยุด'})}
    btn.disabled=true;ok=await saveSettings({holidays:hol});msg='บันทึกวันหยุดแล้ว';
  }
  btn.disabled=false;
  if(ok){const w=val('fWho');if(w)lsSet('kw_who',w);const again=k==='move'&&sheetCode,at=k==='move'?segVal('fType'):'in';closeSheet();toast(msg);if(again)setTimeout(()=>openSheet('scan',{type:at}),600)}
};

const downloads={async save({filename,data}){
  const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}};
$('#btnExport').onclick=async()=>{
  if(!downloads)return;const ex=EXPORTS[S.screen];if(!ex)return;
  const[name,head,rows,tag]=ex();if(!rows.length){toast('ไม่มีข้อมูลให้ส่งออก');return}
  const q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const csv='﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  try{await downloads.save({filename:`${name}_${tag}.csv`,data:new Blob([csv],{type:'text/csv;charset=utf-8'})})}catch(e){}
};

/* ---------- data store: Google Sheets ผ่าน Apps Script หรือโหมดทดลองในเครื่อง ---------- */
const SYNC_COLS=['temps','grease_weeks','stock_items','stock_moves'];
const API=API_URL.trim(),USE_API=/^https?:\/\/\S+\/exec\/?$/.test(API);
const rid=()=>{const a='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789',r=crypto.getRandomValues(new Uint8Array(20));let s='';for(const x of r)s+=a[x%62];return s};
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const dbErr=(code,msg)=>{const e=new Error(msg||code);e.code=code;return e};
function setBanner(html,kind){const b=$('#dbBanner');b.className='banner'+(kind?' '+kind:'');b.innerHTML=html;b.hidden=!html}

/* same small API the app used before: collection().doc().get/set/update/delete, add, orderBy().limit().onSnapshot */
function makeDb(be){
  const C={},L=[];
  const col=c=>C[c]||(C[c]={});
  const dsnap=(id,d)=>({id,exists:d!=null,data:()=>d==null?undefined:clone(d)});
  const qsnap=l=>{let a=Object.entries(col(l.c));
    if(l.f){const s=l.dir==='desc'?-1:1;a.sort((x,y)=>{const p=x[1][l.f]??'',q=y[1][l.f]??'';return p<q?-s:p>q?s:0})}
    if(l.n)a=a.slice(0,l.n);const docs=a.map(([id,d])=>dsnap(id,d));return{docs,size:docs.length,empty:!docs.length}};
  const fire=l=>{try{l.cb(l.id!=null?dsnap(l.id,col(l.c)[l.id]):qsnap(l))}catch(e){console.error(e)}};
  const emit=c=>L.forEach(l=>{if(c==null||l.c===c)fire(l)});
  const listen=l=>{L.push(l);if(be.ready)fire(l);return()=>{const i=L.indexOf(l);if(i>=0)L.splice(i,1)}};
  async function mutate(c,id,next,op,payload){
    const m=col(c),had=Object.prototype.hasOwnProperty.call(m,id),prev=m[id];
    if(next===undefined)delete m[id];else m[id]=next;
    emit(c);
    try{await be.write(op,c,id,payload,C)}
    catch(e){if(had)m[id]=prev;else delete m[id];emit(c);throw e}
  }
  const ref=(c,id)=>({id,
    async get(){const r=await be.get(c,id,col(c)[id]);if(r.exists)col(c)[id]=r.data;return dsnap(id,r.exists?r.data:null)},
    set:d=>mutate(c,id,clone(d),'set',clone(d)),
    update:p=>mutate(c,id,{...(col(c)[id]||{}),...clone(p)},'update',clone(p)),
    delete:()=>mutate(c,id,undefined,'delete',null),
    onSnapshot:(cb,err)=>listen({c,id,cb,err})});
  const query=(c,f,dir,n)=>({orderBy:(f2,d2)=>query(c,f2,d2||'asc',n),limit:n2=>query(c,f,dir,n2),onSnapshot:(cb,err)=>listen({c,f,dir,n,cb,err})});
  return{
    collection:c=>({...query(c),doc:id=>ref(c,id||rid()),add:async d=>{const r=ref(c,rid());await r.set(d);return r}}),
    doc:p=>{const i=p.indexOf('/');return ref(p.slice(0,i),p.slice(i+1))},
    load(data){for(const c in data)C[c]=data[c]},
    emit
  };
}

/* โหมดทดลอง: ยังไม่ได้ใส่ API_URL เก็บข้อมูลใน localStorage ของเครื่องนี้ */
function localBackend(){
  const K='kw_db_';
  const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
  const wr=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){throw dbErr(/quota/i.test(e&&e.name||'')?'quota_exceeded':'storage')}};
  return{mode:'local',ready:true,
    load(){const o={};[...SYNC_COLS,'settings'].forEach(c=>o[c]=rd(K+c)||{});return o},
    async get(c,id,cached){if(c==='grease_photos'){const d=rd(K+'photo_'+id);return{exists:!!d,data:d}}return{exists:cached!=null,data:clone(cached)}},
    async write(op,c,id,payload,C){if(c==='grease_photos')wr(K+'photo_'+id,op==='delete'?null:(C.grease_photos||{})[id]);else wr(K+c,C[c]||{})}
  };
}

/* หลังบ้าน Google Apps Script: POST แบบ text/plain (ไม่ต้อง preflight) ทุกคำขอส่ง PIN ไปด้วย */
let pinAsk=null;
function askPin(wrong){
  if(pinAsk)return pinAsk;
  pinAsk=new Promise(res=>{
    $('#pinMsg').className=wrong?'err':'hint';
    $('#pinMsg').textContent=wrong?'PIN ไม่ถูกต้อง ลองใหม่อีกครั้ง':'ใส่ PIN ที่ได้รับจากหัวหน้างาน ใส่ครั้งเดียว เครื่องนี้จะจำไว้';
    $('#pin').hidden=false;$('#pinIn').value='';setTimeout(()=>{try{$('#pinIn').focus()}catch(e){}},50);
    $('#pinForm').onsubmit=e=>{e.preventDefault();const v=$('#pinIn').value.trim();if(!v){$('#pinIn').focus();return}
      lsSet('kw_pin',v);$('#pin').hidden=true;pinAsk=null;res()};
  });
  return pinAsk;
}
async function api(op,body){
  for(let tries=0;;tries++){
    let txt;
    try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({op,pin:lsGet('kw_pin')||'',...body})});txt=await r.text()}
    catch(e){throw dbErr('network')}
    let j=null;try{j=JSON.parse(txt)}catch(e){}
    if(!j||typeof j!=='object')throw dbErr('bad_url');
    if(j.error==='pin'){await askPin(tries>0||!!lsGet('kw_pin'));continue}
    if(!j.ok)throw dbErr(j.error||'server',j.message);
    return j;
  }
}
const NET={busy:0,seq:0,syncing:false,timer:0,sig:{},fails:0};
function sheetBackend(){
  return{mode:'sheets',ready:false,
    async get(c,id){const j=await api('get',{col:c,id});return{exists:!!j.exists,data:j.data||null}},
    async write(op,c,id,payload){NET.busy++;NET.seq++;try{await api(op,{col:c,id,data:payload})}finally{NET.busy--;syncSoon(1500)}}
  };
}
function syncSoon(ms){clearTimeout(NET.timer);NET.timer=setTimeout(()=>{if(document.hidden)syncSoon(5000);else syncNow()},ms)}
async function syncNow(){
  clearTimeout(NET.timer);if(NET.syncing)return;NET.syncing=true;
  const seq=NET.seq;let next=30000;
  try{
    const j=await api('sync',{});
    if(seq!==NET.seq||NET.busy){next=1500;return}   // มีการบันทึกระหว่างโหลด รอรอบถัดไป
    const d=j.data||{},changed=[];
    SYNC_COLS.forEach(c=>{const s=JSON.stringify(d[c]||[]);if(s!==NET.sig[c]){NET.sig[c]=s;DB.load({[c]:Object.fromEntries(d[c]||[])});changed.push(c)}});
    const ss=JSON.stringify(j.settings||null);if(ss!==NET.sig.settings){NET.sig.settings=ss;DB.load({settings:j.settings?{main:j.settings}:{}});changed.push('settings')}
    if(j.sheetUrl){$('#btnSheet').href=j.sheetUrl;$('#btnSheet').hidden=false}
    NET.fails=0;setBanner('');
    if(!BE.ready){BE.ready=true;S.db=DB;DB.emit()}else changed.forEach(c=>DB.emit(c));
  }catch(e){
    NET.fails++;next=Math.min(60000,10000*NET.fails);
    if(!BE.ready||NET.fails>1){const c=e&&e.code;
      const msg=c==='network'?'เชื่อมต่อหลังบ้านไม่ได้ ตรวจอินเทอร์เน็ต และใน Apps Script ต้องตั้ง "ผู้ที่มีสิทธิ์เข้าถึง: ทุกคน"'
        :c==='bad_url'||c==='bad_op'?'ลิงก์ Apps Script ไม่ถูกต้อง หรือยังไม่ได้อัปเดตเป็นเวอร์ชันใหม่'
        :'หลังบ้านแจ้งข้อผิดพลาด: '+esc(e&&e.message||c||'ไม่ทราบสาเหตุ');
      setBanner((BE.ready?'ข้อมูลอาจยังไม่อัปเดต · ':'ยังบันทึกไม่ได้ · ')+msg,'bad')}
  }finally{NET.syncing=false;syncSoon(next)}
}

const DB=makeDb(BE);
if(BE.mode==='local'){DB.load(BE.load());S.db=DB}

if(BE.mode==='local'){
  setBanner('โหมดทดลอง: ยังไม่ได้ใส่ลิงก์ Apps Script ข้อมูลที่บันทึกจะอยู่ในเครื่องนี้เท่านั้น · <a href="https://github.com/piyanart502-dev/Kitchen#readme" target="_blank" rel="noopener">วิธีเชื่อม Google Sheets</a>');
}else{
  setBanner('กำลังเชื่อมต่อ Google Sheets…','info');syncNow();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
  addEventListener('online',()=>syncNow());
}
setInterval(()=>{if(!sheetKind)renderAll()},60000);
})();
